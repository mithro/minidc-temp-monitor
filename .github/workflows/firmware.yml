name: firmware

on:
  push:
    branches: [main]
    paths: ['firmware/**', '.github/workflows/firmware.yml', '.gitmodules']
  pull_request:
    paths: ['firmware/**', '.github/workflows/firmware.yml', '.gitmodules']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-unknown-elf libnewlib-dev
      - name: Build
        run: make -C firmware
      - name: Host tests
        run: make -C firmware test
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/build/*.bin
            firmware/build/*.elf
            firmware/build/*.map
